# =========================
# GENERAL CONFIG
# =========================

anaTupleDef: AnaProd/anaTupleDef.py
histTupleDef: Analysis/histTupleDef.py
analysis_import: Analysis.H_mumu
phys_model: BaseModel
treeName: Events

# =========================
# COMPUTING / WLCG
# =========================

WLCGFileSystem:
  remotePathCacheHost: cms-flaf.cern.ch
  remotePathCachePort: 5000
  localPathCacheValidity: 600
  verbose: 0

nEventsPerFile:
  data: 1000000
  signals: 1000000
  backgrounds: 1000000


met_type: PuppiMET
storeFatJets: false
signal_types: [ggH, VBFH]
channelSelection: [muMu]

# =========================
# CHANNELS
# =========================
channels:
  selection: [muMu]

  definition:
    muMu: "true"


# =========================
# REGIONS
# =========================
regions:
  MuMuMassRegions:
    Z_sideband: "m_mumu > 70 && m_mumu < 110"
    Signal_Fit: "m_mumu > 115 && m_mumu < 135"
    H_sideband: "((m_mumu > 110 && m_mumu < 115) || (m_mumu > 135 && m_mumu < 150))"
    Signal_ext: "m_mumu > 110 && m_mumu < 150"
    mass_inclusive: "m_mumu > 60 && m_mumu < 150"

# =========================
# TRIGGERS
# =========================
# triggers:
#   muMu:
#     default: "(HLT_singleMu)"

triggers:
  muMu: [ singleMu ]

hist_triggers:
  muMu:
    default: "(HLT_singleMu)"

singleMu_th:
  Run2_2016: 26
  Run2_2017: 29
  Run3_2022: 26
  Run3_2022EE: 26
  Run3_2023: 26
  Run3_2023BPix: 26
  Run3_2024: 26
  Run3_2025: 26

# =========================
# MUONS
# =========================
muons:
  pt_for_selection: pt
  pt_for_definitions: FSR
  ID_WP: Medium
  Iso_WP: Loose

categories_to_select:
  - no_cuts
  - base_sel
  - mu_pt_sel
  - baseline
  - baseline_thirdLepVeto
  - baseline_chi2
  - baseline_lowPtTT
  - baseline_thirdLepVeto_chi2
  - baseline_thirdLepVeto_lowPtTT
  - baseline_chi2_lowPtTT

categories:
  no_cuts: "true"
  trigger_sel: "( HLT_singleMu && ( ( mu1_{mu_pt_for_selection} > {MuPtTh} && mu1_HasMatching_singleMu) || (mu2_{mu_pt_for_selection} > {MuPtTh} && mu2_HasMatching_singleMu) ) ) " # official
  OS_sel: "OS"
  jets_noHorn_cleanFromMu_sel: "JetTagSel"

  mu1_pt_l30 : "mu1_{mu_pt_for_selection} < 30"
  mu2_pt_l30 : "mu2_{mu_pt_for_selection} < 30"
  mu1_pt_g20 : "mu1_{mu_pt_for_selection} > 20"
  mu2_pt_g20 : "mu2_{mu_pt_for_selection} > 20"
  mu_pt_sel: "mu1_pt_g20 && mu2_pt_g20"

  base_sel: "trigger_sel && OS_sel && jets_noHorn_cleanFromMu_sel"

  mu1_ML: "mu1_pfIsoId >= 2 && mu1_mediumId"
  mu1_LL: "mu1_pfIsoId >= 2 && mu1_looseId"
  mu1_TT: "mu1_pfIsoId >= 4 && mu1_tightId"
  mu2_ML: "mu2_pfIsoId >= 2 && mu2_mediumId"
  mu2_LL: "mu2_pfIsoId >= 2 && mu2_looseId"
  mu2_TT: "mu2_pfIsoId >= 4 && mu2_tightId"
  bothMuons_ML: "mu1_ML && mu2_ML"
  bothMuons_LL: "mu1_LL && mu2_LL"

  chi2_sel: "mu1_bsConstrainedChi2 < 30 && mu2_bsConstrainedChi2 < 30"
  pt_lessthan30_and_TT: "(((mu1_pt_l30 && mu1_TT) || !(mu1_pt_l30)) && ((mu2_pt_l30 && mu2_TT) || !(mu2_pt_l30)))"

  baseline: "base_sel && mu1_ML && mu2_ML"
  baseline_thirdLepVeto: "baseline && vetoed_muons==0"
  baseline_chi2: "baseline && chi2_sel"
  baseline_lowPtTT: "(baseline) && (pt_lessthan30_and_TT)"

  baseline_thirdLepVeto_chi2: "baseline && chi2_sel && vetoed_muons==0"
  baseline_thirdLepVeto_lowPtTT: "baseline && (pt_lessthan30_and_TT) && vetoed_muons==0"
  baseline_chi2_lowPtTT: "baseline && (pt_lessthan30_and_TT) && chi2_sel"

  # mu1_prompt: "(mu1_genPartIdx >= 0 && mu1_gen_kind == 2)"
  # mu2_prompt: "(mu2_genPartIdx >= 0 && mu2_gen_kind == 2)"
  # mu1_from_tau: "(mu1_genPartIdx >= 0 && mu1_gen_kind == 4)"
  # mu2_from_tau: "(mu2_genPartIdx >= 0 && mu2_gen_kind == 4)"
  # both_muons_true_prompt: "mu1_prompt && mu2_prompt"
  # at_least_one_muon_from_tau: "!(both_muons_true_prompt) && (mu1_from_tau || mu2_from_tau)"
  # any_muon_not_true: "!(both_muons_true_prompt) && !(at_least_one_muon_from_tau)"


further_cuts: { }

# =========================
# CORRECTIONS
# =========================
corrections:
  btag:
    stages: [ AnaTuple, AnalysisCache, HistTuple ]
    modes:
      AnaTuple: none
      AnalysisCache: none
      HistTuple: none
    tagger: particleNet
    jetCollection: Jet
  mu:
    stage: HistTuple # AnaTuple
    columns:
      pfRelIso04_all: pfRelIso04_all
      tightId: tightId
      tkRelIso: tkRelIso
      highPtId: highPtId
      mediumId: mediumId
      looseId: looseId
      p4: p4_bsConstrainedPt # p4_pt_nano
    lowPt: True
    midPt: True
    hiPt: False
  trigger:
    stages: HistTuple # AnaTuple
    mode: SF
    extraFormat:
      pt: "bsConstrainedPt"
  muScaRe:
    stage: AnaTuple
    mu_pt_for_ScaReApplication: "bsConstrainedPt"
    apply_scare: true
    apply_fsr_recovery: true
  lumi: { stage: AnaTuple }
  xs: { stage: AnaTuple }
  gen: { stage: AnaTuple }
  pu:
    stages: [ AnaTuple, AnaTupleMerge ]
    enabled:
      AnaTuple: true
      AnaTupleMerge: false
  base: { stage: AnaTupleMerge }
  JEC: { stage: AnaTuple }
  JER:
    stage: AnaTuple
    apply_jet_horns_fix: true



# =========================
# SCALES
# =========================
scales: [Up, Down]

ApplyBweight: false


payload_producers:
  DNN:
    producers_module_name: Analysis.DNN_Application
    producer_name: DNNProducer
    columns:
      - NNOutput
    n_cpus: 4
    max_runtime: 2.0
    cmssw_env: False
    awkward_based: True
    uproot_stepsize: '50MB'
    dependencies: [ ]
  VBFNet:
    producers_module_name: Analysis.VBFNet_Application
    producer_name: VBFNetProducer
    columns:
      - NNOutput
    n_cpus: 4
    max_runtime: 2.0
    cmssw_env: False
    awkward_based: True
    uproot_stepsize: '50MB'
    dependencies: [ ]


